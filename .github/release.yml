# Auto-generated release notes configuration.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# Owner action required: create these labels in the repository before relying on
# auto-generated notes — they don't exist yet (`gh label create <name> --color <hex>`):
#   breaking-change, enhancement, bug, security, documentation, dependencies,
#   ignore-for-release

changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
    - title: Security
      labels:
        - security
    - title: Added / Changed
      labels:
        - enhancement
    - title: Fixed
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
